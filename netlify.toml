[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Public client-side PostHog values are bundled into the site on purpose.
  # Without this, Netlify's secrets scan fails the build when they are marked secret.
  SECRETS_SCAN_OMIT_KEYS = "VITE_POSTHOG_PROJECT_TOKEN,VITE_POSTHOG_HOST"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[dev]
  command = "npm run dev"
  port = 5173

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
